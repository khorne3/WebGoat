version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
  - name: 'Block #2'
    task:
      secrets:
        - name: SEMGREP_APP_TOKEN
      jobs:
        - name: 'Job #1'
          commands:
            - '   checkout'
            - '   sudo pip install semgrep'
            - '   semgrep ci'
